    <script>
        function clearCache() {
            const statuses = [
                'Clearing session storage...',
                'Clearing browser cache...',
                'Removing old data...',
                'Reloading page...'
            ];
            let step = 0;
            
            // Clear session storage
            if (window.sessionStorage) {
                const keys = [];
                for (let i = 0; i < sessionStorage.length; i++) {
                    keys.push(sessionStorage.key(i));
                }
                keys.forEach(function(key) {
                    if (key && key.startsWith('kwikshift:')) {
                        sessionStorage.removeItem(key);
                    }
                });
            }
            
            updateStatus('Cleared session storage...');
            
            // Clear service worker cache
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    names.forEach(function(name) {
                        caches.delete(name);
                    });
                    updateStatus('Cleared browser cache...');
                });
            }
            
            // Force page reload after a short delay
            setTimeout(function() {
                updateStatus('Reloading page...');
                window.location.href = './index.html?cache_cleared=' + Date.now();
            }, 1500);
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        // Start clearing cache
        clearCache();
    </script>
